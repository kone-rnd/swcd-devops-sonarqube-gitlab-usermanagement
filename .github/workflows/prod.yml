name: prod - sonarqube usermanagement

on:
  schedule:
    - cron: "0 10 * * 0"
  # push:
  #   branches: [main]
  workflow_dispatch:

permissions:
  id-token: write # AWS OIDC for the S3 backend
  contents: read

concurrency:
  group: tf-prod
  cancel-in-progress: false

env:
  TF_VERSION: "1.13.3"
  AWS_REGION: "eu-west-1"
  WORKING_DIR: "environments/prod"

jobs:
  terraform-plan:
    name: Terraform Plan (Prod)
    runs-on: ubuntu-latest
    environment: prod
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    env:
      TF_VAR_sonarqube_host: ${{ vars.SONAR_HOST }}
      TF_VAR_sonarqube_token: ${{ secrets.SONARQUBE_TOKEN }}
      TF_VAR_sonarqube_edition: community
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_SONAR_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install Python dependencies
        run: pip install requests

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate

      - name: Generate SAML users map
        env:
          SONAR_HOST: ${{ vars.SONAR_HOST }}
          SONAR_TOKEN: ${{ secrets.SONARQUBE_TOKEN }}
        run: python3 ../../scripts/sonar_saml_users.py

      - name: Terraform Plan
        run: terraform plan -input=false -out=tfplan

      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v7
        with:
          name: tfplan-prod
          path: ${{ env.WORKING_DIR }}/tfplan
          retention-days: 5

  terraform-apply:
    name: Terraform Apply (Prod)
    runs-on: ubuntu-latest
    needs: terraform-plan
    if: always() && needs.terraform-plan.result == 'success'
    environment: prod # gate with required reviewers in the GitHub environment
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init -input=false

      - name: Download Plan Artifact
        uses: actions/download-artifact@v8
        with:
          name: tfplan-prod
          path: ${{ env.WORKING_DIR }}

      - name: Terraform Apply
        run: terraform apply -input=false -auto-approve tfplan
