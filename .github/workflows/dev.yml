name: dev - sonarqube usermanagement

on:
  push:
    branches:
      - "f/*"
      - "feat/*"
      - "feature/*"
      - "chore/*"
      - "bug-fix/*"

permissions:
  id-token: write # AWS OIDC for the S3 backend
  contents: read

concurrency:
  group: tf-dev
  cancel-in-progress: false

jobs:
  terraform:
    runs-on: ubuntu-latest
    environment: dev
    defaults:
      run:
        working-directory: environments/dev
    env:
      TF_VAR_sonarqube_host: ${{ secrets.SONARQUBE_HOST }}
      TF_VAR_sonarqube_token: ${{ secrets.SONARQUBE_TOKEN }}
      TF_VAR_sonarqube_edition: community
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-west-1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.3

      - name: Generate SAML users map
        env:
          SONAR_HOST: ${{ secrets.SONARQUBE_HOST }}
          SONAR_TOKEN: ${{ secrets.SONARQUBE_TOKEN }}
        run: python3 ../../services/sonar_saml_users.py

      - run: terraform init -input=false
      - run: terraform plan -input=false
      - run: terraform apply -input=false -auto-approve
